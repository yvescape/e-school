# Installation d'une instance e_school (un groupe, N établissements).
#   cp deploy/.env.example deploy/.env   # puis changer le mot de passe
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: e_school

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: e_school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans deploy/.env}
      POSTGRES_DB: e_school
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e_school"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://e_school:${POSTGRES_PASSWORD}@db:5432/e_school
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db_data:
